syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.hello";
option java_outer_classname = "HelloProto";

package hello;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc SayHello2 (Hello2) returns (Reply2);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

message Hello2 {
  string msg = 1;
  int32 value = 2;
}

message Reply2 {
  bool ok = 1;
}
