plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.6'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'io.grpc:grpc-stub:1.78.0'
    api 'io.grpc:grpc-api:1.78.0'
    api 'com.google.protobuf:protobuf-java:3.25.8'
    implementation 'io.grpc:grpc-protobuf:1.78.0'
    runtimeOnly 'io.grpc:grpc-netty-shaded:1.78.0'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.8"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.78.0"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
