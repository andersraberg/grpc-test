
plugins {
//    id("com.netflix.nebula.ospackage") version "12.2.0"
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(project(":hello"))
    implementation 'io.grpc:grpc-api:1.78.0'
    implementation 'io.grpc:grpc-stub:1.78.0'
}

application {
    mainClass = 'com.example.hello.HelloServer'
}

configurations {
    appDist
}

artifacts {
    appDist(tasks.named("installDist"))
}
